name: Release plugin version to Moodle Marketplace

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to be released (for example, v1.0.7)'
        required: true
        type: string

jobs:
  release-to-marketplace:
    uses: moodlehq/moodle-plugin-release/.github/workflows/moodle-release.yml@main
    with:
      tag: ${{ inputs.tag }}
    secrets:
      MOODLE_MARKETPLACE_TOKEN: ${{ secrets.MOODLE_MARKETPLACE_TOKEN }}

  release-on-github:
    name: Create GitHub Release
    needs: release-notes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Package plugin
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: git archive --format=zip --output="${GITHUB_REPOSITORY##*/}.zip" "$RELEASE_TAG"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          repository_name="${GITHUB_REPOSITORY##*/}"
          archive="${repository_name}.zip"
          title="${repository_name} ${RELEASE_TAG}"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$title" --notes-file RELEASE.md
            gh release upload "$RELEASE_TAG" "$archive" --clobber
          else
            gh release create "$RELEASE_TAG" "$archive" \
              --title "$title" \
              --notes-file RELEASE.md \
              --verify-tag
          fi
